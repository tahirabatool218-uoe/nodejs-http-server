<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Node.js Server Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #1f2937;
        }

        header {
            background: #111827;
            color: white;
            padding: 24px 8%;
        }

        header h1 {
            margin-bottom: 8px;
        }

        header p {
            color: #cbd5e1;
        }

        main {
            width: 84%;
            max-width: 1100px;
            margin: 40px auto;
        }

        .status {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .status span {
            color: #16a34a;
            font-weight: bold;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            background: #2563eb;
            color: white;
            padding: 10px 16px;
            border-radius: 7px;
        }

        .btn:hover {
            background: #1d4ed8;
        }

        footer {
            text-align: center;
            color: #64748b;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <h1>Node.js HTTP Server</h1>
    <p>Node.js Fundamentals Project</p>
</header>

<main>

    <div class="status">
        Server Status:
        <span id="serverStatus">Checking...</span>

        <br>

        Port:
        <span id="serverPort">...</span>
    </div>

    <div class="grid">

        <div class="card">
            <h2>About Server</h2>

            <p>
                Learn about the Node.js concepts demonstrated
                in this project.
            </p>

            <a class="btn" href="/about">
                View About
            </a>
        </div>

        <div class="card">
            <h2>File Manager</h2>

            <p>
                Read and write data using Node.js
                File System module.
            </p>

            <a class="btn" href="/file">
                Open File Manager
            </a>
        </div>

    </div>

</main>

<footer>
    Built with Node.js core modules
</footer>

<script>
    async function loadServerStatus() {

        try {
            const response = await fetch("/api/status");
            const data = await response.json();

            document.getElementById("serverStatus").textContent =
                "● " + data.status;

            document.getElementById("serverPort").textContent =
                data.port;

        } catch (error) {

            document.getElementById("serverStatus").textContent =
                "● Offline";

            document.getElementById("serverPort").textContent =
                "Unavailable";
        }
    }

    loadServerStatus();
</script>

</body>
</html>
